name: dash-stack-sonarqube

services:
  sonarqube-db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${SONARQUBE_DB_NAME}
      POSTGRES_USER: ${SONARQUBE_DB_USER}
      POSTGRES_PASSWORD: ${SONARQUBE_DB_PASSWORD}
    volumes:
      - sonarqube_db_data:/var/lib/postgresql/data
    networks:
      - sonarqube-internal
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  sonarqube:
    image: sonarqube:26.9.0.129388-community
    restart: unless-stopped
    depends_on:
      sonarqube-db:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonarqube-db:5432/${SONARQUBE_DB_NAME}
      SONAR_JDBC_USERNAME: ${SONARQUBE_DB_USER}
      SONAR_JDBC_PASSWORD: ${SONARQUBE_DB_PASSWORD}
    ports:
      - '${SONARQUBE_PORT:-9000}:9000'
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    networks:
      - sonarqube-internal
      - sonarqube-public
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'curl -fsS http://localhost:9000/api/system/status | grep -q ''"status":"UP"''',
        ]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s

  sonar-scanner:
    image: sonarsource/sonar-scanner-cli:12.2.0.4256_8.1.0
    profiles: ['scan']
    depends_on:
      sonarqube:
        condition: service_healthy
    environment:
      SONAR_HOST_URL: http://sonarqube:9000
      SONAR_TOKEN: ${SONAR_TOKEN:?Set SONAR_TOKEN in .env.sonarqube}
      SONAR_USER_HOME: /opt/sonar-scanner/.sonar
      SONAR_SCANNER_OPTS: -Dsonar.working.directory=/tmp/.scannerwork
    volumes:
      - ./:/usr/src:ro
      - sonarqube_scanner_cache:/opt/sonar-scanner/.sonar/cache
    networks:
      - sonarqube-public

networks:
  sonarqube-internal:
    internal: true
  sonarqube-public:

volumes:
  sonarqube_db_data:
    name: dash-stack-sonarqube-db-data
  sonarqube_data:
    name: dash-stack-sonarqube-data
  sonarqube_extensions:
    name: dash-stack-sonarqube-extensions
  sonarqube_logs:
    name: dash-stack-sonarqube-logs
  sonarqube_scanner_cache:
    name: dash-stack-sonarqube-scanner-cache
