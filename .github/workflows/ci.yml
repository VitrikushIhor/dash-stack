name: CI

on:
  push:
    branches: [main, dev, develop]
  pull_request:
    branches: [main, dev, develop]

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10.34.5'

jobs:
  # ============================================
  # DETECT CHANGES
  # ============================================
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      root: ${{ steps.filter.outputs.root }}
    steps:
      - name: Checkout code
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332

      - name: Detect file changes
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
            backend:
              - 'backend/**'
            root:
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.npmrc'
              - 'lint-staged.config.mjs'
              - '.github/workflows/ci.yml'

  # ============================================
  # LINT AND TYPE CHECK - FRONTEND
  # ============================================
  lint-frontend:
    name: Lint (frontend)
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' || needs.changes.outputs.root == 'true' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332

      - name: Install pnpm
        uses: pnpm/action-setup@0c17529a66aca453f9227af23103ed11469b1e47
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm --filter frontend run lint

      - name: Run Steiger (FSD architecture linter)
        run: pnpm --filter frontend run lint:fsd

      - name: Run TypeScript type check
        run: pnpm --filter frontend run type-check

      - name: Check code formatting
        run: pnpm --filter frontend run format:check

  # ============================================
  # LINT - BACKEND
  # ============================================
  lint-backend:
    name: Lint (backend)
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' || needs.changes.outputs.root == 'true' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332

      - name: Install pnpm
        uses: pnpm/action-setup@0c17529a66aca453f9227af23103ed11469b1e47
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm --filter backend run lint

      - name: Run TypeScript type check
        run: pnpm --filter backend run type-check

      - name: Check code formatting
        run: pnpm --filter backend run format:check

  # ============================================
  # BUILD - FRONTEND
  # ============================================
  build-frontend:
    name: Build (frontend)
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' || needs.changes.outputs.root == 'true' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332

      - name: Install pnpm
        uses: pnpm/action-setup@0c17529a66aca453f9227af23103ed11469b1e47
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create frontend .env for build
        run: cp frontend/.env.example frontend/.env

      - name: Build frontend
        run: pnpm --filter frontend run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: frontend-dist
          path: frontend/.next
          retention-days: 7

  # ============================================
  # BUILD - BACKEND
  # ============================================
  build-backend:
    name: Build (backend)
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' || needs.changes.outputs.root == 'true' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332

      - name: Install pnpm
        uses: pnpm/action-setup@0c17529a66aca453f9227af23103ed11469b1e47
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build backend
        run: pnpm --filter backend run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: backend-dist
          path: backend/dist
          retention-days: 7

  # ============================================
  # TESTS - BACKEND
  # ============================================
  test-backend:
    name: Tests (backend)
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' || needs.changes.outputs.root == 'true' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332

      - name: Install pnpm
        uses: pnpm/action-setup@0c17529a66aca453f9227af23103ed11469b1e47
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm --filter backend run test

  # ============================================
  # VOCABULARY DATABASE/HTTP INTEGRATION
  # ============================================
  test-vocab-integration:
    name: Vocabulary Integration
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' || needs.changes.outputs.root == 'true' }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: phase10
          POSTGRES_PASSWORD: phase10
          POSTGRES_DB: phase10
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U phase10 -d phase10"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://phase10:phase10@localhost:5432/phase10
      JWT_ACCESS_SECRET: phase10-ci-access-secret
      JWT_REFRESH_SECRET: phase10-ci-refresh-secret

    steps:
      - name: Checkout code
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332

      - name: Install pnpm
        uses: pnpm/action-setup@0c17529a66aca453f9227af23103ed11469b1e47
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply migrations
        run: pnpm --filter backend run migrate:deploy

      - name: Run Vocabulary integration tests
        run: pnpm --filter backend run test:integration

  # ============================================
  # SECURITY AUDIT
  # ============================================
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' || needs.changes.outputs.backend == 'true' || needs.changes.outputs.root == 'true' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332

      - name: Install pnpm
        uses: pnpm/action-setup@0c17529a66aca453f9227af23103ed11469b1e47
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run security audit
        run: pnpm audit --audit-level=moderate
        continue-on-error: true

  # ============================================
  # TESTS - FRONTEND
  # ============================================
  test-frontend:
    name: Tests (frontend)
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' || needs.changes.outputs.root == 'true' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332

      - name: Install pnpm
        uses: pnpm/action-setup@0c17529a66aca453f9227af23103ed11469b1e47
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm --filter frontend run test

      - name: Run tests with coverage
        run: pnpm --filter frontend run test:coverage

  # ============================================
  # VOCABULARY BROWSER E2E
  # ============================================
  test-vocab-e2e:
    name: Vocabulary Browser E2E
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' || needs.changes.outputs.backend == 'true' || needs.changes.outputs.root == 'true' }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: phase10
          POSTGRES_PASSWORD: phase10
          POSTGRES_DB: phase10
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U phase10 -d phase10"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://phase10:phase10@localhost:5432/phase10
      JWT_ACCESS_SECRET: phase10-ci-access-secret
      JWT_REFRESH_SECRET: phase10-ci-refresh-secret
      PORT: '8000'
      CORS_ORIGINS: http://127.0.0.1:3000
      API_URL: http://127.0.0.1:8000
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
      E2E_FRONTEND_URL: http://127.0.0.1:3000
      E2E_BACKEND_URL: http://127.0.0.1:8000/api
      STORAGE_PROVIDER: local

    steps:
      - name: Checkout code
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332

      - name: Install pnpm
        uses: pnpm/action-setup@0c17529a66aca453f9227af23103ed11469b1e47
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply migrations
        run: pnpm --filter backend run migrate:deploy

      - name: Seed browser E2E data
        run: pnpm --filter backend run seed

      - name: Install Chromium
        run: pnpm --filter frontend exec playwright install --with-deps chromium

      - name: Run Vocabulary browser E2E
        run: pnpm --filter frontend run test:e2e

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: vocabulary-playwright-artifacts
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
          retention-days: 7

  # ============================================
  # DOCKER BUILD - FRONTEND
  # ============================================
  docker-frontend:
    name: Docker Build (frontend)
    runs-on: ubuntu-latest
    needs: [changes, lint-frontend, build-frontend, test-frontend]
    if: ${{ needs.changes.outputs.frontend == 'true' || needs.changes.outputs.root == 'true' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@988b5a0280414f521da01fcc63a27aeeb4b104db

      - name: Build Docker image
        uses: docker/build-push-action@2cdde995de11925a030ce8070c3d77a52ffcf1c0
        with:
          context: .
          file: ./frontend/Dockerfile
          push: false
          tags: dash-stack-frontend:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=http://localhost:8000/api
            NEXT_PUBLIC_APP_URL=http://localhost:3000
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================
  # DOCKER BUILD - BACKEND
  # ============================================
  docker-backend:
    name: Docker Build (backend)
    runs-on: ubuntu-latest
    needs: [changes, lint-backend, build-backend, test-backend]
    if: ${{ needs.changes.outputs.backend == 'true' || needs.changes.outputs.root == 'true' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@988b5a0280414f521da01fcc63a27aeeb4b104db

      - name: Build Docker image
        uses: docker/build-push-action@2cdde995de11925a030ce8070c3d77a52ffcf1c0
        with:
          context: .
          file: ./backend/Dockerfile
          push: false
          tags: dash-stack-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
