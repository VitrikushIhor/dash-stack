services:
  # ============================================
  # DATABASE
  # ============================================
  postgres:
    image: postgres:15-alpine
    container_name: dash-stack-db-dev
    restart: unless-stopped
    ports:
      - "5432:5432"
    env_file:
      - ./backend/.env
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # BACKEND (NestJS) - Development with hot-reload
  # ============================================
  backend:
    container_name: dash-stack-backend-dev
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules
    env_file:
      - ./backend/.env
    environment:
      # Override DATABASE_URL to point to the Postgres container (not localhost)
      DATABASE_URL: postgresql://${POSTGRES_USER:-prisma}:${POSTGRES_PASSWORD:-topsecret}@postgres:5432/${POSTGRES_DB:-test}?schema=${DB_SCHEMA:-public}&sslmode=disable
      ENABLE_LOGS: true

  # ============================================
  # FRONTEND (Next.js) - Development with hot-reload
  # ============================================
  frontend:
    container_name: dash-stack-frontend-dev
    image: node:22-alpine
    working_dir: /app
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: sh -c "corepack enable && pnpm install && pnpm run dev"
    env_file:
      - ./frontend/.env
    environment:
      PORT: 3000


volumes:
  postgres_data_dev:
    name: dash-stack-db-data-dev
