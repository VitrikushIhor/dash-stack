sonar.projectKey=dash-stack-local
sonar.projectName=Dash Stack
sonar.sourceEncoding=UTF-8
sonar.javascript.node.maxspace=4096

sonar.sources=.
sonar.tests=frontend/src,frontend/tests,backend/src

sonar.exclusions=\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.spec.ts,\
  **/*.spec.tsx,\
  **/tests/**,\
  **/node_modules/**,\
  **/.next/**,\
  **/dist/**,\
  **/coverage/**,\
  **/generated/**,\
  .git/**,\
  .sonarlint/**,\
  .vscode/**,\
  test-artifacts/**

sonar.test.inclusions=\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.spec.ts,\
  **/*.spec.tsx,\
  **/tests/**

sonar.coverage.exclusions=\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.spec.ts,\
  **/*.spec.tsx,\
  **/tests/**,\
  **/*.config.ts,\
  **/*.config.js,\
  backend/prisma/**

sonar.cpd.exclusions=\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.spec.ts,\
  **/*.spec.tsx,\
  **/tests/**,\
  backend/prisma/migrations/**

sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5,e6,e7
sonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S6759
sonar.issue.ignore.multicriteria.e1.resourceKey=frontend/**/*.tsx
sonar.issue.ignore.multicriteria.e2.ruleKey=typescript:S5906
sonar.issue.ignore.multicriteria.e2.resourceKey=frontend/**/*.test.ts
sonar.issue.ignore.multicriteria.e3.ruleKey=typescript:S5906
sonar.issue.ignore.multicriteria.e3.resourceKey=frontend/**/*.test.tsx
sonar.issue.ignore.multicriteria.e4.ruleKey=typescript:S4138
sonar.issue.ignore.multicriteria.e4.resourceKey=frontend/**/*.ts*
sonar.issue.ignore.multicriteria.e5.ruleKey=typescript:S6606
sonar.issue.ignore.multicriteria.e5.resourceKey=frontend/**/*.ts*
sonar.issue.ignore.multicriteria.e6.ruleKey=typescript:S7776
sonar.issue.ignore.multicriteria.e6.resourceKey=backend/prisma/reset.ts
sonar.issue.ignore.multicriteria.e7.ruleKey=plsql:VarcharUsageCheck
sonar.issue.ignore.multicriteria.e7.resourceKey=backend/prisma/migrations/**/*.sql
